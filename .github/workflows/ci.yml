name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ota
          POSTGRES_PASSWORD: ota
          POSTGRES_DB: ota
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ota"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://ota:ota@localhost:5432/ota
      # Throwaway, and public on purpose: it only has to be 32 base64 bytes so
      # the config loads. Real installs generate their own (see .env.example).
      OTA_MASTER_KEY: PoxCDjT5yabltpNamGib2V+78AkR/5iGFQmlQcvGxLg=

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Also proves the generated SQL still applies to an empty database.
      - run: pnpm db:migrate

      - run: pnpm test

      - run: pnpm build
